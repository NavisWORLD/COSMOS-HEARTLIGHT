name: HEARTLIGHT static audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run HEARTLIGHT audit
        run: python tests/static_audit.py
      - name: Compile Python helpers
        run: python -m py_compile run_local.py tests/static_audit.py
