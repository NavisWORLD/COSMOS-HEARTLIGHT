name: HEARTLIGHT native build

on:
  push:
    paths:
      - 'native/**'
      - 'contracts/**'
      - '.github/workflows/native-build.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'contracts/**'
      - '.github/workflows/native-build.yml'

jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++
        run: cmake -S native/cpp -B build/cpp -DCMAKE_BUILD_TYPE=Release
      - name: Build C++
        run: cmake --build build/cpp --parallel 2
      - name: Test C++
        run: ctest --test-dir build/cpp --output-on-failure
      - name: Stage installable C++ package
        run: cmake --install build/cpp --prefix build/cpp-install
      - name: Upload C++ libraries
        uses: actions/upload-artifact@v4
        with:
          name: heartlight-cpp-linux
          path: build/cpp-install/

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Rust toolchain
        run: rustc --version && cargo --version
      - name: Test Rust workspace
        run: cargo test --workspace --manifest-path native/rust/Cargo.toml
      - name: Build Rust release
        run: cargo build --release --workspace --manifest-path native/rust/Cargo.toml
      - name: Upload Rust libraries
        uses: actions/upload-artifact@v4
        with:
          name: heartlight-rust-linux
          path: |
            native/rust/target/release/libheartlight_ffi.a
            native/rust/target/release/libheartlight_ffi.so
