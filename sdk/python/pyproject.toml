[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heartlight-synapse"
version = "1.0.0"
description = "Deterministic cross-language 12-channel HEARTLIGHT synaptic kernel"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
